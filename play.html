<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#111}
    iframe{width:100%;height:100%;border:0;background:#fff}
    .bar{position:fixed;z-index:10;top:0;left:0;right:0;height:42px;background:#111;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font:14px Arial;box-sizing:border-box}
    .bar a{color:#fff;text-decoration:none}.bar button{margin-left:auto}
    iframe{height:calc(100% - 42px);margin-top:42px}
  </style>
</head>
<body>
  <div class="bar"><a id="back">← Voltar</a><span id="title">Jogo</span><button id="fullscreen">Tela cheia</button></div>
  <iframe id="gameFrame" sandbox="allow-scripts allow-forms allow-pointer-lock allow-popups allow-same-origin"></iframe>
  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const frame = document.getElementById("gameFrame");
    const title = document.getElementById("title");
    document.getElementById("back").href = "javascript:history.back()";
    document.getElementById("fullscreen").onclick = () => frame.requestFullscreen?.();
    if (!id) throw new Error("Jogo não informado.");
    const snap = await getDoc(doc(db, "games", id));
    if (!snap.exists()) throw new Error("Jogo não encontrado.");
    const g = snap.data();
    title.textContent = g.name || "Jogo";
    frame.src = g.htmlUrl;
  </script>
</body>
</html>
